name: Docker Image (Nix)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "**.rst"
      - "**FUNDING.yml"
  pull_request:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.push_tags.outputs.tags }}

    steps:
      - name: Set docker image tag to 'develop'
        run: echo "DOCKER_TAG=develop" >> "$GITHUB_ENV"

      - name: Set docker image tag to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "DOCKER_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Set image tag
        id: push_tags
        run: echo "tags=3dgi/roofer:${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-docker-${{ matrix.system }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-docker-${{ matrix.system }}-
          gc-max-store-size-linux: 3000000000

      - name: Build flake package, GDAL checks, and image
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          nix build ".#checks.${NIX_SYSTEM}.gdal" --no-link --max-jobs 2 --cores 2
          nix build ".#dockerImage.${NIX_SYSTEM}.roofer" --out-link image --max-jobs 2 --cores 2
          nix path-info --closure-size --human-readable .#default
          du -hL image
          echo "ROOFER_IMAGE=roofer:$(nix eval --raw .#default.version)" >> "$GITHUB_ENV"

      - name: Load and smoke test image
        run: |
          docker load --input image
          docker run --rm "$ROOFER_IMAGE" --version | grep -F "$GITHUB_SHA"
          docker run --rm "$ROOFER_IMAGE" --help
          docker image inspect "$ROOFER_IMAGE" --format 'Uncompressed image size: {{.Size}} bytes'

      - name: Push architecture image and export digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tags }}-${{ matrix.arch }}
        run: |
          docker tag "$ROOFER_IMAGE" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          image_digest=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          mkdir -p /tmp/digests
          touch "/tmp/digests/${image_digest##*@sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest
        env:
          IMAGE_NAME: 3dgi/roofer
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          IFS=',' read -r -a tags <<< "$IMAGE_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          image_args=()
          for digest in /tmp/digests/*; do
            image_args+=("${IMAGE_NAME}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
