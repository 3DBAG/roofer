name: Docker Builder Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "**.rst"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set docker image tag to 'develop'
        run: echo "DOCKER_TAG=develop" >> $GITHUB_ENV

      - name: Set docker image tag to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "DOCKER_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set immutable develop tag with commit hash
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        run: echo "EXTRA_TAG=develop-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Assemble push tags
        id: push_tags
        if: github.event_name != 'pull_request'
        run: |
          tags="3dgi/roofer:${DOCKER_TAG}"
          if [ -n "${EXTRA_TAG:-}" ]; then
            tags="${tags},3dgi/roofer:${EXTRA_TAG}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            GIT_HASH=${{ github.sha }}
          push: false
          tags: 3dgi/roofer:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=3dgi/roofer:buildcache

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            GIT_HASH=${{ github.sha }}
          push: true
          tags: ${{ steps.push_tags.outputs.tags }}
          cache-from: type=registry,ref=3dgi/roofer:buildcache
          cache-to: type=registry,ref=3dgi/roofer:buildcache,mode=max
